# Project definition for kratheos-food-data: the build tool that downloads open
# food-composition databases and rebuilds one aggregated database from them.
# Dependencies are kept to a minimum: DuckDB does the heavy lifting (it filters
# a multi-gigabyte Parquet file without loading it), openpyxl reads the Excel
# files that some publishers ship.

[project]
name = "kratheos-food-data"
version = "0.1.0"
description = "Downloads open food-composition databases and rebuilds one aggregated database from them."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.2",
    "openpyxl>=3.1",
]

[project.scripts]
food-data = "kratheos_food_data.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kratheos_food_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = [
    "D203", # one-blank-line-before-class conflicts with D211
    "D213", # multi-line-summary-second-line conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"
