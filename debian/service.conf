# Settings of kratheos-food-data, read by the service and by its two timers.
# One KEY=value per line, without quotes (systemd EnvironmentFile).
# Restart the service after a change: systemctl restart kratheos-food-data

# Where the data live: food.sqlite, live.sqlite, manifest.json.
FOOD_DATA_DIR=/var/lib/kratheos-food-data

# Where the service listens. Keep 127.0.0.1 when the application that calls it
# runs on this machine; otherwise the private address of this machine, behind
# the firewall. Reads need no authentication: never a public address.
FOOD_DATA_HOST=127.0.0.1
FOOD_DATA_PORT=8750

# Shared secret of the writes and of moderation (Authorization: Bearer ...).
# Generated at the first installation; give the same value to the application.
FOOD_DATA_TOKEN=

# Secret the contributor keys are hashed with. Generated at the first
# installation. Changing it makes every person count as a new one: keep it,
# and keep a copy with the backups of live.sqlite.
FOOD_DATA_KEY_SECRET=

# Votes a version entered by a user needs to be served instead of a record of
# a source. The monthly rebuild reads the same value.
FOOD_DATA_USER_VERSION_VOTES=3

# Time a search may spend in the full-text index, in milliseconds.
FOOD_DATA_SEARCH_BUDGET_MS=500

# A contact added to the User-Agent of the downloads of the rebuild (optional).
#FOOD_DATA_CONTACT=mailto:someone@example.org
