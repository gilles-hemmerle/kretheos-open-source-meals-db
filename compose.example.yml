# Example of a Compose file for the food service.
#
#   mkdir data                                   # everything lives here, on the host
#   export FOOD_DATA_TOKEN=$(openssl rand -hex 32)
#   docker compose -f compose.example.yml up -d
#   docker compose -f compose.example.yml run --rm food \
#       install-database --url https://example.org/food/v1
#
# The databases are in ./data of the host (a bind mount), never in a volume of
# Docker: they survive the container and the image, and can be backed up like
# any directory. The service answers 503 until a database is installed, and
# picks a new one up without being restarted.
#
# The weekly export and the monthly rebuild are run from the host, by cron or
# a systemd timer, with a clone of the repository in ./data/repository:
#
#   docker compose -f compose.example.yml run --rm food export-layer --commit
#   docker compose -f compose.example.yml run --rm food rebuild

services:
  food:
    build: .
    image: kratheos-food-data
    restart: unless-stopped
    # The owner of ./data on the host, so that the files belong to that user.
    user: "${FOOD_DATA_UID:-1000}:${FOOD_DATA_GID:-1000}"
    environment:
      # Shared secret of the writes; without it the service only answers reads.
      FOOD_DATA_TOKEN: "${FOOD_DATA_TOKEN:-}"
      FOOD_DATA_USER_VERSION_VOTES: "3"
    ports:
      # Reads need no authentication: publish on the loopback address only, or
      # on a private address behind your firewall.
      - "127.0.0.1:8750:8750"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
