# Declarative list of the food databases this project knows about.
#
# One [[source]] table per database. A source is only built when `enabled` is
# true; a disabled source stays listed with the `reason` it is not used.
#
# Fields of a source:
#   id            short stable identifier, prefix of every record id
#   name          name of the database
#   publisher     who publishes it
#   homepage      page of the database
#   adapter       module of kratheos_food_data.adapters that reads it
#   version       release of the files listed below ("rolling" = taken from the
#                 download itself on each build)
#   released      date of that release
#   kinds         what it holds: "generic" foods and/or barcoded "product"s
#   priority      fixed source order, lowest first; the last tie-breaker when a
#                 preferred record is chosen for a barcode
#   licence       SPDX identifier, or a short name when SPDX has none
#   licence_name  full name of the licence or terms
#   licence_url   text of the licence or terms
#   terms_url     publisher page where the terms were read
#   terms_quote   sentence(s) of the publisher that allow redistribution
#   terms_checked date the terms were last read by a human
#   attribution   text to reproduce next to the data
#   share_alike   true when the licence requires derived databases to keep it
#   enabled       whether the build uses the source
#   reason        why it is disabled (empty when enabled)
#   country       ISO 3166-1 alpha-2 code of the country whose foods a table
#                 of generic foods describes (the country of the authority
#                 that publishes it); empty for a source whose records carry
#                 their own countries
#   mirror        where the files are stored, exactly as downloaded:
#                   "git"      small files, downloaded into sources/<id>/
#                              and committed with the repository
#                   "release"  files too large for git, downloaded into the
#                              git-ignored mirror/ under the flat name
#                              <id>.<file name>, to be attached to a release
#
# Fields of a [[source.files]] entry:
#   name          file name (in sources/<id>/, or after `<id>.` in mirror/)
#   url           where to download it
#   sha256 / md5  checksum pinned for a file published under a versioned
#                 address. A pinned file is never downloaded twice. If the
#                 publisher replaces it, the build keeps the stored copy and
#                 says so: read what changed, then update the version and the
#                 checksum here. The checksums of a downloaded file are in the
#                 .meta.json sidecar next to it

